name: fuzz
on:
  workflow_dispatch:

jobs:
  fuzz-statesync:
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    steps:
      - name: Checkout (v0.16.4-fuzz, shallow)
        uses: actions/checkout@v4
        with:
          ref: v0.16.4-fuzz
          fetch-depth: 1
          submodules: recursive

      - name: Install deps (clang-19 + gtest + all cmake deps)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ninja-build lsb-release wget gnupg software-properties-common pkg-config \
            libgtest-dev libgmock-dev \
            libboost-all-dev libcap-dev \
            libbrotli-dev libcrypto++-dev libzstd-dev libcli11-dev libtbb-dev libarchive-dev liburing-dev libgmp-dev
          wget https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 19
          clang-19 --version | head -3
          # Ubuntu ships GTest headers only; build + install the libs from source
          cd /usr/src/googletest
          sudo cmake -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_GMOCK=ON
          sudo cmake --build build -j4
          sudo cmake --install build
          # GCC 15 provides libstdc++-15 (C++23 std::optional::value_or); Monad requires GCC>=15
          sudo add-apt-repository -y ppa:ubuntu-toolchain-r/test
          sudo apt-get update
          sudo apt-get install -y g++-15
          # smoke test: does clang-19 now resolve std::optional::value_or?
          printf '#include <optional>\nint main(){std::optional<int> o; return o.value_or(0);}\n' \
            | clang++-19 -std=gnu++23 -x c++ - -o /tmp/smoke_value_or \
            && echo "VALUE_OR_OK" || echo "VALUE_OR_STILL_MISSING"

      - name: Configure (clang-fuzz)
        run: |
          set -o pipefail
          CC=clang-19 CXX=clang++-19 cmake -G Ninja -B build \
            -DCMAKE_TOOLCHAIN_FILE=category/core/toolchains/clang-fuzz.cmake \
            -DCMAKE_BUILD_TYPE=Debug 2>&1 | tail -30

      - name: Build fuzz_statesync
        run: |
          set -o pipefail
          df -h /home/runner
          cmake --build build --target fuzz_statesync -j2 2>&1 | tail -50

      - name: Fuzz statesync
        run: |
          mkdir -p artifacts
          # io_uring_register_buffers must pin its 32MB buffers -> needs RLIMIT_MEMLOCK
          ulimit -l unlimited 2>/dev/null || true
          sudo prlimit --pid $$ --memlock=unlimited:unlimited 2>/dev/null || true
          echo "memlock soft limit: $(ulimit -l)"
          set +e
          ./build/category/statesync/fuzz_statesync \
            -max_total_time=7200 \
            -max_len=1024 \
            -rss_limit_mb=5000 \
            -artifact_prefix=artifacts/ \
            -print_final_stats=1 > fuzz.log 2>&1
          FUZZ_EXIT=$?
          echo "=== FUZZ_EXIT_CODE=$FUZZ_EXIT ==="
          tail -80 fuzz.log
          echo "=== artifacts ==="
          ls -la artifacts/ 2>/dev/null || echo "(no artifacts)"
          exit 0

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-artifacts
          path: |
            artifacts/
            fuzz.log
          if-no-files-found: ignore
