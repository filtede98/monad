name: fuzz
on:
  workflow_dispatch:

jobs:
  fuzz-statesync:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - name: Checkout (v0.16.4, shallow)
        uses: actions/checkout@v4
        with:
          ref: v0.16.4
          fetch-depth: 1
          submodules: recursive

      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build clang-18
          clang-18 --version
          df -h /

      - name: Configure (clang-fuzz)
        run: |
          CC=clang-18 CXX=clang++-18 cmake -G Ninja -B build \
            -DCMAKE_TOOLCHAIN_FILE=category/core/toolchains/clang-fuzz.cmake \
            -DCMAKE_BUILD_TYPE=Debug 2>&1 | tail -30

      - name: Build fuzz_statesync
        run: cmake --build build --target fuzz_statesync -j2 2>&1 | tail -40

      - name: Fuzz statesync
        run: |
          mkdir -p artifacts
          ./build/category/statesync/fuzz_statesync \
            -max_total_time=7200 \
            -artifact_prefix=artifacts/ \
            -print_final_stats=1 2>&1 | tail -60

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-artifacts
          path: artifacts/
          if-no-files-found: ignore
